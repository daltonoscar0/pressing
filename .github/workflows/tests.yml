name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked installs exactly what uv.lock pins rather than re-resolving.
      # No network marker is defined in this repo, so there is no -m filter to
      # apply; the tests that need absent data skip themselves.
      - name: Install
        run: uv sync --locked --all-extras

      # Uses the demo/fixture data committed in the repo. Verified locally:
      # 707 passed.
      #
      # TERM=dumb is load-bearing. Rich treats GITHUB_ACTIONS as a
      # colour-capable terminal and forces styling on, so `--help` output comes
      # back with ANSI escapes interleaved through the text. Five assertions in
      # tests/test_cli.py look for plain substrings in that output
      # ("file, not a directory", "'home' or 'away'", "only one built") and
      # fail against the escaped version. NO_COLOR=1 does not help -- Rich
      # ignores it once it has decided it is on a terminal -- but TERM=dumb
      # does. Reproduced locally with GITHUB_ACTIONS=true and verified fixed
      # by TERM=dumb. The tests themselves are unchanged.
      - name: Run tests
        env:
          TERM: dumb
        run: uv run pytest
