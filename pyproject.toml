[project]
name = "pressing"
version = "0.1.0"
description = "Counter-press report generator: pitch control, 5-second recovery metrics, and coach-ready match PDFs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton" }]
keywords = ["soccer", "football", "tracking-data", "pitch-control", "counter-press"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pydantic>=2",
    "requests",
    "tqdm",
    "reportlab",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyter",
    "nbformat",
    "nbconvert",
]

[project.scripts]
pressing = "pressing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pressing"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
